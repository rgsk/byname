[project]
name = "byname"
version = "0.1.0"
description = "Bind-by-name shorthand for Python: fn(name=, age=), (name=, age=) records, and destructuring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
byname = "byname.cli:main"

[project.entry-points.pytest11]
# pytest collects test_*.pyn wherever byname is installed (see pytest_plugin.py)
byname = "byname.pytest_plugin"

[project.optional-dependencies]
lsp = [
    "basedpyright>=1.40.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "pytest>=8",
    "ruff>=0.16.10",
]

[tool.ruff]
# ruff can't turn wrapping off; 320 is its maximum, so lines are never split for length.
# Multi-line code stays multi-line only with a trailing comma (ruff's "magic trailing comma").
line-length = 320

[tool.basedpyright]
# the editor (byname lsp) and `byname tool basedpyright` both read this; "recommended", basedpyright's
# default, is noisy
typeCheckingMode = "standard"
